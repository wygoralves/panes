name: Dependency Audit

# Reports known advisories in the npm and Rust dependency trees. The jobs never
# fail on findings: they write them to the job summary and raise a warning.
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pnpm_audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Report npm advisories
        run: |
          status=0
          pnpm audit > pnpm-audit.txt 2>&1 || status=$?
          cat pnpm-audit.txt
          {
            echo "## pnpm audit"
            echo '```'
            cat pnpm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::pnpm audit reported advisories (exit $status). See the job summary."
          fi

  cargo_audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Report RustSec advisories
        working-directory: src-tauri
        run: |
          status=0
          cargo audit > cargo-audit.txt 2>&1 || status=$?
          cat cargo-audit.txt
          {
            echo "## cargo audit"
            echo '```'
            cat cargo-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning::cargo audit reported advisories (exit $status). See the job summary."
          fi
