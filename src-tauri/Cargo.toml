[package]
name = "Panes"
version = "0.67.0"
edition = "2021"
rust-version = "1.91"
authors = ["Panes contributors"]
license = "MIT"

[lib]
name = "agent_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png"] }
tauri-plugin-shell = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-notification = "2.8"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
toml = "0.8"
libc = "0.2"

rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
which = "6"
flate2 = "1"
tar = "0.4"

git2 = { version = "0.19", features = ["vendored-openssl"] }
notify = "6"
portable-pty = "0.9"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
# ShellExecuteExW for "Open in default app", so no cmd.exe parses the path.
open = { version = "5", features = ["shellexecute-on-windows"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Keep local debug builds inspectable without letting `target/` explode as quickly.
debug = 1
